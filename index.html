<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F4E78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Money Planner">
<link rel="manifest" href="manifest.json">
<title>Money Planner</title>
<style>
:root{--blue:#1f4e78;--bg:#f4f7fa;--green:#2e7d32;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;color:#243447}
header{background:var(--blue);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 20px;border-radius:0 0 24px 24px}
header h1{margin:0;font-size:25px}header p{margin:5px 0 0;opacity:.86}
main{max-width:560px;margin:auto;padding:14px 15px calc(30px + env(safe-area-inset-bottom))}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:-3px}.card,.box{background:#fff;border-radius:17px;padding:15px;box-shadow:0 3px 14px #0000000c}.card small{color:#718096}.card b{display:block;font-size:19px;margin-top:5px}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1;padding:12px;border:1px solid #d5dee7;background:#fff;color:var(--blue);border-radius:12px;font-weight:700}.tabs .active{background:var(--blue);color:#fff}
h2{font-size:18px;margin:0 0 10px}.box{margin-bottom:14px}label{font-size:13px;font-weight:700;display:block;margin:10px 0 5px}
input,select,button{font:inherit;width:100%;padding:12px;border:1px solid #d6dee7;border-radius:11px;background:#fff}button.save{background:var(--blue);color:#fff;border:0;font-weight:700;margin-top:13px}
.item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #edf0f3}.item:last-child{border-bottom:0}.item small{display:block;color:#7a8794;margin-top:4px}.out{color:var(--red);font-weight:700}.in{color:var(--green);font-weight:700}.delete{color:var(--red);font-size:12px;margin-top:4px;cursor:pointer}.empty{text-align:center;color:#7a8794;padding:20px 0}
.tip{font-size:12px;color:#687684;line-height:1.45;margin-top:9px}
</style>
</head>
<body>
<header><main style="padding:0"><h1>💰 Money Planner</h1><p>Keuangan pribadi — otomatis tersimpan di perangkat</p></main></header>
<main>
<div class="cards">
<div class="card"><small>Pemasukan</small><b id="income">Rp0</b></div>
<div class="card"><small>Pengeluaran</small><b id="expense">Rp0</b></div>
<div class="card"><small>Saldo</small><b id="balance">Rp0</b></div>
<div class="card"><small>Transaksi</small><b id="count">0</b></div>
</div>

<div class="tabs">
<button id="outTab" class="active" onclick="setType('Pengeluaran')">💸 Pengeluaran</button>
<button id="inTab" onclick="setType('Pemasukan')">💰 Pemasukan</button>
</div>

<section class="box">
<h2 id="title">Tambah Pengeluaran</h2>
<label>Tanggal</label><input id="date" type="date">
<label>Kategori</label>
<select id="cat"><option>Makanan</option><option>Transportasi</option><option>Tagihan</option><option>Belanja</option><option>Rumah</option><option>Pendidikan</option><option>Kesehatan</option><option>Hiburan</option><option>Tabungan</option><option>Gaji</option><option>Usaha</option><option>Bonus</option><option>Lainnya</option></select>
<label>Nominal</label><input id="amount" type="number" inputmode="numeric" placeholder="Contoh: 30000">
<label>Keterangan</label><input id="note" placeholder="Contoh: bensin">
<button class="save" onclick="add()">Simpan Transaksi</button>
<div class="tip">Data disimpan di perangkat ini. Jika Safari menghapus data situs, data lokal dapat ikut terhapus.</div>
</section>

<section class="box">
<h2>📋 Transaksi Terbaru</h2>
<div id="list"></div>
</section>
</main>
<script>
let type = 'Pengeluaran';
let data = [];

const incomeEl = document.getElementById('income');
const expenseEl = document.getElementById('expense');
const balanceEl = document.getElementById('balance');
const countEl = document.getElementById('count');
const outTab = document.getElementById('outTab');
const inTab = document.getElementById('inTab');
const titleEl = document.getElementById('title');
const dateEl = document.getElementById('date');
const catEl = document.getElementById('cat');
const amountEl = document.getElementById('amount');
const noteEl = document.getElementById('note');
const listEl = document.getElementById('list');

try { data = JSON.parse(localStorage.getItem('moneyPlanner') || '[]'); } catch(e) { data = []; }
dateEl.value = new Date().toISOString().slice(0,10);

function rp(n) {
  return new Intl.NumberFormat('id-ID', {style:'currency', currency:'IDR', maximumFractionDigits:0}).format(n);
}

function setType(t) {
  type = t;
  titleEl.textContent = t === 'Pengeluaran' ? 'Tambah Pengeluaran' : 'Tambah Pemasukan';
  outTab.classList.toggle('active', t === 'Pengeluaran');
  inTab.classList.toggle('active', t === 'Pemasukan');
}

function addTransaction() {
  const a = Number(amountEl.value);
  if (!a || a <= 0) { alert('Nominal belum diisi.'); return; }
  data.push({id: Date.now(), type, date: dateEl.value, cat: catEl.value, amount: a, note: noteEl.value.trim()});
  localStorage.setItem('moneyPlanner', JSON.stringify(data));
  amountEl.value = '';
  noteEl.value = '';
  render();
}

function del(id) {
  data = data.filter(x => x.id !== id);
  localStorage.setItem('moneyPlanner', JSON.stringify(data));
  render();
}

function render() {
  const inc = data.filter(x => x.type === 'Pemasukan').reduce((s,x) => s + x.amount, 0);
  const exp = data.filter(x => x.type === 'Pengeluaran').reduce((s,x) => s + x.amount, 0);
  incomeEl.textContent = rp(inc);
  expenseEl.textContent = rp(exp);
  balanceEl.textContent = rp(inc - exp);
  countEl.textContent = data.length;
  if (!data.length) {
    listEl.innerHTML = '<div class="empty">Belum ada transaksi.</div>';
    return;
  }
  listEl.innerHTML = [...data].reverse().map(x => `
    <div class="item">
      <div><b>${escapeHtml(x.cat)}</b><small>${escapeHtml(x.date)} · ${escapeHtml(x.note || '-')}</small></div>
      <div style="text-align:right"><span class="${x.type === 'Pengeluaran' ? 'out' : 'in'}">${x.type === 'Pengeluaran' ? '-' : '+'}${rp(x.amount)}</span><div class="delete" data-id="${x.id}">hapus</div></div>
    </div>`).join('');
  listEl.querySelectorAll('.delete').forEach(btn => btn.addEventListener('click', () => del(Number(btn.dataset.id))));
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

outTab.addEventListener('click', () => setType('Pengeluaran'));
inTab.addEventListener('click', () => setType('Pemasukan'));
document.querySelector('.save').addEventListener('click', addTransaction);
render();

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(() => {}); }
</script>\n</body></html>
